project:
  type: book
  output-dir: Notes

book:
  title: "Introduction to (Bio)Statistics"
  reader-mode: true
  page-footer:
    left: |
      Introduction to (Bio)Statistics, by Jo Hardin.
    right: |
      Built with 💚 and <a href="https://quarto.org/">Quarto</a>.
  cover-image: figs/type_2_errors_featured.png
  favicon: figs/favicon.ico
  site-url: https://m58-intro-stats.netlify.app/
  repo-url: https://github.com/hardin47/m58-intro-stats
  repo-branch: main
  repo-actions: [issue]
  chapters:
    - index.qmd
    - 00-Rfunc.qmd
    - 01-intro.qmd
    - 02-FoundInf.qmd
    - 03-InfCat.qmd
    - 03.5-interlude.qmd
    - 04-InfNum.qmd
    - 05-CorRegDesc.qmd
    - 06-CorRegInf.qmd
        
bibliography: 
  - book.bib
  - packages.bib

format:
  html:
    theme:
      - scss/colors.scss
    header-includes: |
      <link rel="stylesheet" media="screen" href="https://fonts.googleapis.com/css2?family=Quicksand" type="text/css"/>
    code-link: true
    mainfont: Quicksand
    monofont: Quicksand
    include-in-header:
      - js/mathjax-popover.html
    author-meta: "Jo Hardin"
    lightbox: 
      match: auto
      loop: false 
    embed-resources: true

editor: source

execute:
  freeze: false
  fig-width: 6
  fig-show: hold
  fig-dpi: 300
  fig-align: center
  echo: true
  cache: false
  warning: false 
  callout-icon: false


knitr:
  opts_chunk: 
    dev: "ragg_png"
    fig-asp: 0.618  # 1 / phi
