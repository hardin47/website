project:
  type: book
  output-dir: Notes

book:
  title: "Methods in Biostatistics"
  reader-mode: true
  page-footer:
    left: |
      Methods in Biostatistics, by Jo Hardin.
    right: |
      Built with 💚 and <a href="https://quarto.org/">Quarto</a>.
  cover-image: figs/p_value_mic_hog_featured.jpg
  favicon: figs/favicon.ico
  site-url: https://m150-method-biostat.netlify.app/
  repo-url: https://github.com/hardin47/m150-method-biostat
  repo-branch: main
  repo-actions: [issue]
  chapters:
    - index.qmd
    - 00-Rfunc.qmd
    - 01-intro.qmd
    - 02-ttest.qmd
    - 03-SLR.qmd
    - 04-cat.qmd
    - 05-log.qmd
    - 05a-model.qmd
    - 06-surv.qmd
    - 07-MC.qmd
    - 08-PoisReg.qmd

        
bibliography: 
  - book.bib
  - packages.bib

format:
  html:
    theme:
      - scss/colors.scss
    header-includes: |
      <link rel="stylesheet" media="screen" href="https://fonts.googleapis.com/css2?family=Quicksand" type="text/css"/>
    code-link: true
    mainfont: Quicksand
    monofont: Quicksand
    include-in-header:
      - js/mathjax-popover.html
    author-meta: "Jo Hardin"
    lightbox: 
      match: auto
      loop: false 
    embed-resources: true

editor: source

execute:
  freeze: false
  fig-width: 6
  fig-show: hold
  fig-dpi: 300
  fig-align: center
  echo: true
  cache: false
  warning: false 
  callout-icon: false

crossref:
  chapters: true

knitr:
  opts_chunk: 
    dev: "ragg_png"
    fig-asp: 0.618  # 1 / phi
